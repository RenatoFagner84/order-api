
name: Testes e CI

on:
  push:
    branches:
      - principal
  pull_request:
    branches:
      - principal

permissions:
  contents: read

jobs:
  testes:
    name: Executar testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test
